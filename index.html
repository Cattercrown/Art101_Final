<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potato Farming</title>
    <link rel="stylesheet" href="potato.css">
    <script src="jquery-3.7.1.min.js"></script>
    <script src="potato.js" defer></script>
</head>

<body>
    <button id="day-button">Day 1</button>
    <p>Follow Farmer Bunny's instructions to care for the potato.</p>

    <div id="items">
        <!-- draggable lets the browser start dragging this element. -->
        <div id="item-WateringCan" class="item" draggable="true">
            <img src="watering-can.png">
        </div>

        <div id="item-Rake" class="item" draggable="true">
            <img src="rake.png">
        </div>

        <div id="item-Gloves" class="item" draggable="false">
            <img src="gloves_placeholder.jpg" draggable="false">
        </div>
        
    </div>

    <div id="target">
        <img src="potato.png">
    </div>

    <!-- Modal content -->
    <div class="modal-content">
        <div class="modal-header">
            <span class="close">&times;</span>
            <h2>Farmer Bunny</h2>
        </div>

        <div class="modal-body">
            <p id="result" aria-live="polite">Hello!! I'm Farmer Bunny! For your first task can you water the potato?
            </p>
        </div>

        <div class="modal-footer">
            <h3>Task 1: Water Potato</h3>
        </div>
    </div>

    <div id="farmer">
        <!-- draggable lets the browser start dragging this element. -->
        <div id="farm-Bunny" class="bunny" draggable="false">
            <img src="jooody.jpeg">

</body>

</html>
